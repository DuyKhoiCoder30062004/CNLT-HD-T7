spring.application.name=ecommerce
spring.datasource.url=${SPRING_DATA_URL}
spring.datasource.username={SPRING_DATA_USER}
spring.datasource.password={SPRING_DATA_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
#dung driver PostgreSQL de mo~ ket noi toi' DB
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.show-sql=true
#spring.profiles.active=dev,stage,prod
