spring.application.name=ecommerce

spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_LOCAL}
spring.datasource.username=${DB_USERNAME_LOCAL}
spring.datasource.password=${DB_PASSWORD_LOCAL}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
server.error.include-message=always

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:db.migration
spring.jpa.hibernate.ddl-auto=validate

logging.level.org.springframework.transaction.interceptor=trace
logging.level.org.springframework.orm.jpa.JpaTransactionManager=debug

jwt.secret=${JWT_SECRET_KEY}
