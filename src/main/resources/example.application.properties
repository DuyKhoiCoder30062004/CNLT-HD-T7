spring.application.name=ecommerce

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ecommerce}
spring.datasource.username=${DB_USERNAME_LOCAL:ecommerce}
spring.datasource.password=${DB_PASSWORD_LOCAL:ecommerce_local}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
server.error.include-message=always

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate

logging.level.org.springframework.transaction.interceptor=${TRANSACTION_LOG_LEVEL:info}
logging.level.org.springframework.orm.jpa.JpaTransactionManager=${JPA_TRANSACTION_LOG_LEVEL:info}

jwt.secret=${JWT_SECRET_KEY:local-development-jwt-secret-key-change-before-deploying-1234567890}

# VNPay sandbox
vnpay.pay-url=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:8080/api/v1/payments/vnpay/return}
vnpay.tmn-code=${VNPAY_TMN_CODE:}
vnpay.hash-secret=${VNPAY_HASH_SECRET:}
