services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: "${DB_LOCAL:-ecommerce}"
      POSTGRES_USER: "${DB_USERNAME_LOCAL:-ecommerce}"
      POSTGRES_PASSWORD: "${DB_PASSWORD_LOCAL:-ecommerce_local}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ecommerce_postgres_data:/var/lib/postgresql/data

volumes:
  ecommerce_postgres_data:
